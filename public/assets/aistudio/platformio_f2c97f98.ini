; =============================================================================
;  T-Deck World — persistent AI petri dish
;  Build:  cd ~/tdeck-world && pio run
;  Flash:  cp .pio/build/tdeck/firmware.bin /media/.../world.bin  → SD → Launcher
; =============================================================================

[platformio]
default_envs = tdeck

[env:tdeck]
platform                    = espressif32@6.9.0
board                       = esp32-s3-devkitc-1
framework                   = arduino

board_build.flash_size      = 16MB
board_build.psram_type      = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions      = default_16MB.csv
board_upload.flash_size     = 16MB

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; ---- TFT_eSPI for T-Deck Plus ST7789 (same proven config) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
